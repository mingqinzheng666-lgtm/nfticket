name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    name: Contract tests (Hardhat)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the Node/npm that generated package-lock.json; an older npm
          # computes a different tree and fails `npm ci` on a valid lockfile.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  frontend:
    name: Frontend tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the Node/npm that generated package-lock.json; an older npm
          # computes a different tree and fails `npm ci` on a valid lockfile.
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
